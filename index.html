<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JOAO</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, sans-serif; }
body { min-height:100vh; background: linear-gradient(135deg, #f8a4d8 0%, #c084fc 30%, #a78bfa 60%, #93c5fd 100%); display:flex; justify-content:center; align-items:center; padding:20px; }
.card { background: rgba(255,255,255,0.2); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.3); border-radius:28px; padding:50px 30px; width:100%; max-width:380px; text-align:center; }
h1 { color:white; font-size:46px; font-weight:800; margin-bottom:12px; }
.subtitle { color: rgba(255,255,255,0.9); font-size:17px; margin-bottom:32px; }
.btn { display:flex; justify-content:center; width:100%; background: rgba(255,255,255,0.25); border-radius:16px; padding:16px; margin-bottom:14px; color:white; text-decoration:none; font-size:16px; }
</style>
</head>
<body>
<div class="card">
<h1>JOAO</h1>
<p class="subtitle">✨ Bienvenido a mi página ✨</p>
<a class="btn" href="#">📸 Instagram</a>
<a class="btn" href="#">🎵 TikTok</a>
<a class="btn" href="#">💬 WhatsApp</a>
</div>
</body>
</html>
